services:
  henry-tracker:
    build:
      context: .
      dockerfile: src/HenryTracker/Dockerfile
    container_name: henry-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HENRY_APP_PASSWORD: ${HENRY_APP_PASSWORD:?Set HENRY_APP_PASSWORD in your .env file}
    volumes:
      - henry-data:/app/data

volumes:
  henry-data:
