services:
  cat-tracker:
    build:
      context: .
      dockerfile: src/CatTracker/Dockerfile
    container_name: cat-tracker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in your .env file}
    volumes:
      - cat-data:/app/data

volumes:
  cat-data:
